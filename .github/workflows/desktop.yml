name: Desktop installers

on:
  workflow_dispatch:
  push:
    # One tag per release: npm (publish.yml runs from main) and the desktop
    # installers share the same version. Linux has no desktop shell; it uses
    # the CLI + Web UI.
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 14 images are retired, and macos-latest has moved to macOS 26
          # arm64; pin the images this repo is tested against.
          # windows-latest points at Windows Server 2025 with Visual Studio
          # 2026, whose VS 18 install node-gyp cannot detect yet, so
          # better-sqlite3 fails to build; windows-2022 still has VS 2022.
          - os: macos-15
            artifact: mac-arm64
            target: mac
            arch: arm64
          - os: macos-15-intel
            artifact: mac-x64
            target: mac
            arch: x64
          - os: windows-2022
            artifact: win-x64
            target: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        env:
          AGENT_DOCK_SKIP_NATIVE_CHECK: "1"
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      # Notarization with an App Store Connect API key needs a .p8 file on
      # disk. The secret holds its base64 content; skip when it is not set.
      # (`secrets` is not available inside step `if:` expressions, so the
      # presence check happens in the shell.)
      - name: Prepare Apple notarization key
        if: matrix.target == 'mac'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "APPLE_API_KEY_P8 is not set; notarization is disabled"
            exit 0
          fi
          # BSD base64 on macOS: -D, not GNU's --decode.
          printf '%s' "$APPLE_API_KEY_P8" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"

      - name: Package desktop app
        working-directory: apps/desktop
        env:
          # Signing is optional. Without the matching certificate secret,
          # electron-builder must not try to auto-discover a keychain identity;
          # the config then falls back to ad-hoc signing on macOS.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.target == 'mac' && secrets.MAC_CERT_P12 != '') || (matrix.target == 'win' && secrets.WIN_CERT_P12 != '') }}
          CSC_LINK: ${{ matrix.target == 'mac' && secrets.MAC_CERT_P12 || secrets.WIN_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.MAC_CERT_PASSWORD || secrets.WIN_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ matrix.target == 'mac' && secrets.APPLE_API_KEY_P8 != '' && format('{0}/AuthKey.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Optional: Azure Trusted Signing (Windows). Entra credentials come
          # from AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET.
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ secrets.AZURE_SIGNING_PUBLISHER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: pnpm dist -- --${{ matrix.target }} --${{ matrix.arch }} --publish never

      - name: Verify macOS signature
        if: matrix.target == 'mac'
        shell: bash
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          NOTARIZED: ${{ secrets.APPLE_ID != '' || secrets.APPLE_API_KEY_P8 != '' }}
        run: |
          app=$(find apps/desktop/release -maxdepth 2 -name 'AgentDock.app' -print -quit)
          if [ -z "$app" ]; then
            echo "AgentDock.app not found under apps/desktop/release" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1
          if [ -n "$MAC_CERT_P12" ]; then
            codesign -dv "$app" 2>&1 | grep -q 'Authority=Developer ID Application' \
              || { echo "expected a Developer ID signature, got ad-hoc" >&2; exit 1; }
          fi
          if [ "$NOTARIZED" = "true" ]; then
            echo "--- Gatekeeper assessment (informational) ---"
            spctl --assess --type execute --verbose=4 "$app" || true
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: AgentDock ${{ steps.version.outputs.value }}
          # Cross-link the npm release and the desktop installers so either
          # entry point leads to the other.
          body: |
            **npm 包**：[`@agent-dock/cli@${{ steps.version.outputs.value }}`](https://www.npmjs.com/package/@agent-dock/cli/v/${{ steps.version.outputs.value }})

            ```bash
            npm i -g @agent-dock/cli@${{ steps.version.outputs.value }}
            ```

            macOS（Apple Silicon / Intel）和 Windows 安装包见下方 Assets。Linux 使用 Web UI 版本：安装上面的 npm 包后运行 `agent-dock start`，打开 <http://127.0.0.1:4310>。

            macOS 构建当前为 ad-hoc 签名（未经 Apple 公证）。首次打开若被拦截，请在「系统设置 → 隐私与安全性」中选择「仍要打开」，或右键 App → 打开。
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

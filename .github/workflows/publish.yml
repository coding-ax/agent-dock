name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Version bump (patch or minor)'
        type: choice
        options:
          - patch
          - minor
        default: patch

permissions:
  contents: write
  # npm provenance: lets registry.npmjs.org link the package back to this
  # repository and the exact workflow run that built it.
  id-token: write

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

jobs:
  publish:
    # The version-bump commit carries [skip release], so its push to main does
    # not publish again. A manual dispatch always publishes.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        env:
          AGENT_DOCK_SKIP_NATIVE_CHECK: "1"
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Bump version
        id: version
        working-directory: apps/server
        env:
          RELEASE_TYPE: ${{ inputs.release_type || 'patch' }}
        run: |
          npm version "$RELEASE_TYPE" --no-git-tag-version
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));fs.appendFileSync(process.env.GITHUB_OUTPUT, 'value='+j.version+'\n')"

      - name: Publish to npm
        working-directory: apps/server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --tag latest --registry=https://registry.npmjs.org

      - name: Commit release version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/package.json
          git commit -m "chore(release): v${VERSION} [skip release]"
          git push origin HEAD:main

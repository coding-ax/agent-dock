syntax = "proto3";
package lark;

message Frame {
  uint64 seqid = 1;
  uint64 logid = 2;
  int32 service = 3;
  int32 method = 4;
  repeated ExtendedEntry headers = 5;
  string payloadEncoding = 6;
  string payloadType = 7;
  bytes payload = 8;
}
message ExtendedEntry { string key = 1; string value = 2; }

message improto {
  enum PayloadType { TYPE_UNKNOWN = 0; PB2 = 1; JSON = 2; }
  enum Command { UNKNOWN = 0; }
  message PipeEntity { string type = 1; int64 id = 3; }
  message VersionRange { string start = 1; string end = 2; }
  message VersionPayload { VersionRange versionRange = 1; bytes payload = 2; }
  message Packet {
    string sid = 1;
    PayloadType payloadType = 2;
    Command cmd = 3;
    uint32 status = 4;
    bytes payload = 5;
    string cid = 6;
    PipeEntity pipeEntity = 7;
    repeated VersionPayload versionPayloads = 8;
    repeated PipeEntity pipeEntities = 9;
    uint32 waitRetryInterval = 10;
    int32 command = 11;
    uint64 cursor = 12;
    repeated int32 compactedSids = 13;
  }
  message PullPacketsBySidsRequest { repeated string sids = 1; }
  message PullPacketsBySidsResponse { map<string, Packet> packets = 1; }
}

message chats {
  message PullChatsByIdsRequest { repeated string chatIds = 1; }
  message PullChatsByIdsResponse {
    map<string, entities.Chat> chats = 1;
    repeated string unauthorizedChatIds = 2;
    repeated string inThreadChatIds = 3;
  }
}

message chatters {
  message PullChattersByIdsRequest { repeated string chatterIds = 1; bool needBotInfo = 2; }
  message PullChattersByIdsResponse {
    map<string, entities.Chatter> chatters = 1;
    int64 maxAge = 2;
  }
}

message entities {
  enum ChatType { UNKNOWN_CHAT_TYPE = 0; P2P = 1; GROUP = 2; TOPIC_GROUP = 3; }
  message Image {
    string key = 1;
    repeated string urls = 2;
    int32 width = 3;
    int32 height = 4;
    string secureKey = 5;
    repeated string secureUrls = 6;
  }
  message Message {
    enum Type {
      UNKNOWN = 0; POST = 2; FILE = 3; TEXT = 4; IMAGE = 5; SYSTEM = 6; AUDIO = 7;
      EMAIL = 8; SHARE_GROUP_CHAT = 9; STICKER = 10; MERGE_FORWARD = 11; CALENDAR = 12;
      CLOUD_FILE = 13; CARD = 14; MEDIA = 15; SHARE_CALENDAR_EVENT = 16; HONGBAO = 17;
      GENERAL_CALENDAR = 18; VIDEO_CHAT = 19; LOCATION = 20; COMMERCIALIZED_HONGBAO = 22;
      SHARE_USER_CARD = 23; TODO = 24; FOLDER = 25;
    }
    enum FromType { FROMTYPE_UNSPECIFIED = 0; USER = 1; BOT = 2; }
    enum Status { UNKNOWN_STATUS = 0; NORMAL = 1; DELETED = 2; MODIFIED = 3; }
    string id = 1;
    Type type = 2;
    string fromId = 3;
    int64 createTime = 4;
    bytes content = 5;
    Status status = 6;
    FromType fromType = 7;
    string rootId = 8;
    string parentId = 9;
    string chatId = 10;
    string cid = 12;
    int32 position = 13;
    string threadId = 20;
    string channelId = 24;
    repeated string atOutChatterIds = 38;
    ChatType chatType = 46;
    repeated int64 atUserIdList = 64;
  }
  message Chat {
    enum Type { UNKNOWN = 0; P2P = 1; GROUP = 2; TOPIC_GROUP = 3; }
    enum ChatMode { UNKNOWN_CHAT_MODE = 0; DEFAULT = 1; THREAD = 2; THREAD_V2 = 3; }
    string id = 1;
    Type type = 2;
    string name = 4;
    Image avatar = 5;
    int32 memberCount = 12;
    int32 lastMessagePosition = 15;
    int32 userCount = 16;
    ChatMode chatMode = 39;
    Image miniAvatar = 52;
  }
  message Chatter {
    string id = 1;
    string name = 2;
    string avatarUrl = 5;
    string enUsName = 14;
    string email = 25;
    Image avatarImage = 29;
  }
  message FeedCard {
    string id = 1;
    int32 type = 2;
    int64 updateTime = 3;
    int64 parentCardId = 5;
  }
  message RichText {
    repeated string elementIds = 1;
    string innerText = 2;
    RichTextElements elements = 3;
  }
  message RichTextElements {
    map<string, RichTextElement> dictionary = 1;
  }
  message RichTextElement {
    enum Tag {
      UNKNOWN_TAG = 0; TEXT = 1; IMG = 2; P = 3; FIGURE = 4; AT = 5; A = 6; B = 7;
      I = 8; U = 9; EMOTION = 10; BUTTON = 11; SELECT = 12; DIV = 14; TEXTABLE_AREA = 15;
      TIME = 16; LINK = 17; MEDIA = 18; DOCS = 22; H1 = 23; H2 = 24; H3 = 25; UL = 26;
      OL = 27; LI = 28; QUOTE = 29; CODE = 30; CODE_BLOCK = 31; HR = 32; REACTION = 35;
      MENTION = 36; CODE_BLOCK_V2 = 37; H4 = 44; H5 = 45; H6 = 46; AT_USER_GROUP = 47;
    }
    Tag tag = 1;
    map<string, string> style = 2;
    bytes property = 3;
    repeated string childIds = 4;
    message AnchorProperty {
      string href = 1;
      string content = 2;
      string textContent = 3;
      bool isCustom = 9;
      int32 scene = 10;
    }
    message CodeBlockProperty { int32 language = 1; string content = 2; }
    message TextProperty { string content = 1; }
    message AtProperty { string userId = 1; string content = 2; }
  }
}

message feed {
  message PullFeedCardsRequest {
    int32 type = 1;
    int32 pullType = 2;
    int64 cursor = 3;
    int32 count = 4;
    int64 parentCardId = 5;
  }
  message PullFeedCardsResponse {
    repeated entities.FeedCard cards = 3;
    int64 nextCursor = 4;
  }
}

message messages {
  message PushMessagesRequest {
    map<string, entities.Message> messages = 1;
    map<string, bool> participatedMessageIds = 3;
    map<string, bool> forcePush = 8;
    map<string, bool> messagesAtMe = 9;
  }
  message PullMessagesByIdsRequest { repeated string messageIds = 1; }
  message PullMessagesByIdsResponse { map<string, entities.Message> messages = 1; }
  message PullMessagesByPositionsRequest {
    string chatId = 1;
    repeated int32 positions = 2;
    int32 type = 3;
    int32 direction = 7;
  }
  message PullMessagesByPositionsResponse { map<int32, entities.Message> messages = 1; }
  message PushBatchCopyMessages {
    repeated int64 messageIds = 1;
    entities.Message lastMessage = 3;
  }
  message TextContent { string text = 1; entities.RichText richText = 3; }
  message PostContent { string title = 1; string text = 2; entities.RichText richText = 6; }
  message CreateReactionRequest { string messageId = 1; string type = 2; }
  message PutMessageRequest {
    entities.Message.Type type = 1;
    Content content = 2;
    string chatId = 3;
    string rootId = 4;
    string parentId = 5;
    string cid = 6;
    bool isNotified = 7;
    bool sendToChat = 8;
    int32 version = 9;
    bool isThreadGroupTopic = 10;
    bool isAnonymous = 11;
    bool isReplyInThread = 12;
    repeated int64 atUserIdList = 14;
    message Content { string text = 1; entities.RichText richText = 14; }
  }
  message PutMessageResponse { entities.Message message = 1; }
}
